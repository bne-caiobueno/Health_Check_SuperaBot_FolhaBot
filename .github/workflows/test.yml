name: Teste Diario do APK

on:
  workflow_dispatch: # Permite acionar o teste manualmente ou via API (n8n)

jobs:
  maestro-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do seu repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura o Java (necessário para o emulador e ferramentas Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instala a ferramenta de teste (Maestro)
      - name: Install Maestro
        run: |
          curl -FsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # 4. Inicia o emulador Android e executa o teste
      - name: Run Android Emulator and Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            adb install app/seu-app.apk
            maestro test .github/workflows/flow.yaml
